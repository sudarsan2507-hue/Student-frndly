<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Friendly — Skill Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    // Applied before paint so there's no light->dark flash on load —
    // ThemeContext keeps these in sync afterwards. Kept in lockstep with
    // the localStorage keys in src/context/ThemeContext.jsx.
    (function () {
      try {
        var mode = localStorage.getItem('sf-theme-mode');
        var palette = localStorage.getItem('sf-theme-palette');
        if (mode) document.documentElement.dataset.theme = mode;
        if (palette) document.documentElement.dataset.palette = palette;
      } catch (e) { /* private mode etc. */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
